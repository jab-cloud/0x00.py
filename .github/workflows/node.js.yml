# This workflow validates the JavaScript syntax and repository structure.
# It skips dependency-based steps since the repository does not use a build system.

name: Code Validation CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Validate JavaScript Syntax
      run: |
        node -c ai_focus_app/app.js
        node -c ai_focus_app/sw.js

    - name: Verify Web Directory Structure
      run: |
        ls ai_focus_app/index.html
        ls ai_focus_app/styles.css
        ls ai_focus_app/manifest.json
