name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Verify Directory Structure
      run: |
        ls -d ai_focus_app
        ls ai_focus_app/index.html
        ls ai_focus_app/app.js
        ls ai_focus_app/styles.css

    - name: Syntax Check JavaScript
      run: |
        node -c ai_focus_app/app.js
        node -c ai_focus_app/sw.js

    - name: Build and Test (if present)
      run: |
        if [ -f package.json ]; then
          pnpm install
          pnpm run build --if-present
          pnpm test
        else
          echo "No package.json found at root, skipping pnpm steps."
        fi
